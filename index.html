<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本地図パズルマスター - 都道府県＆地方クイズ</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --primary-color: #3b82f6;
            --success-color: #34d399;
            --error-color: #f87171;
            
            /* 画像から抽出したパステルカラー */
            --color-hokkaido: #f4b3b3;
            --color-tohoku: #f4b3b3;
            --color-kanto: #f9d8b0;
            --color-chubu: #bce3b5;
            --color-kinki: #bce3eb;
            --color-chugoku: #c1c9f7;
            --color-shikoku: #e6c1f4;
            --color-kyushu: #fab7cc;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            color: #1e293b;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: bold;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #e2e8f0;
            color: #475569;
        }

        button.active {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(59, 130, 246, 0.3);
        }

        .scoreboard {
            font-size: 1.1rem;
            font-weight: bold;
            background: var(--card-bg);
            padding: 8px 20px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: inline-block;
        }

        .map-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: auto;
            max-height: 650px;
        }

        /* 画像デザインに合わせた境界線とスタイル */
        .pref-path {
            stroke: #ffffff;
            stroke-width: 2.5;
            stroke-linejoin: round;
            stroke-linecap: round;
            cursor: pointer;
            transition: opacity 0.2s ease, filter 0.2s ease;
        }

        .pref-path:hover {
            filter: brightness(0.9);
            opacity: 0.95;
        }

        .pref-path.active-highlight {
            stroke: #2563eb !important;
            stroke-width: 4 !important;
            filter: drop-shadow(0 0 6px rgba(37, 99, 235, 0.5));
        }

        .pref-path.solved {
            fill: var(--success-color) !important;
        }

        .divider-line {
            stroke: #cbd5e1;
            stroke-width: 1.5;
            stroke-dasharray: 4 4;
        }

        /* モーダル表示 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 100;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: white;
            padding: 24px;
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .modal h2 {
            margin-top: 0;
            font-size: 1.3rem;
            color: #1e293b;
        }

        .input-group {
            margin: 15px 0;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
        }

        .btn-submit {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-cancel {
            background-color: #f1f5f9;
            color: #64748b;
        }

        .feedback-msg {
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            min-height: 1.2em;
        }

        .feedback-msg.correct { color: #059669; }
        .feedback-msg.wrong { color: var(--error-color); }
    </style>
</head>
<body>

    <header>
        <h1>🗾 日本地図マスター</h1>
        <div class="controls">
            <button id="modePref" class="active" onclick="switchMode('pref')">都道府県モード</button>
            <button id="modeRegion" onclick="switchMode('region')">地方モード</button>
            <button onclick="resetGame()" style="background-color: #fee2e2; color: #dc2626;">リセット</button>
        </div>
        <div class="scoreboard">
            スコア: <span id="score">0</span> / <span id="totalScore">47</span>
        </div>
    </header>

    <div class="map-container">
        <svg viewBox="0 0 800 800" id="japanMap">
            <path d="M 520,620 L 780,620 L 780,780" fill="none" class="divider-line" />
            <g id="mapPaths"></g>
        </svg>
    </div>

    <!-- 入力モーダル -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">回答を入力</h2>
            <div id="prefInputs">
                <div class="input-group">
                    <label for="inputPref">都道府県名</label>
                    <input type="text" id="inputPref" placeholder="例: 東京都" autocomplete="off">
                </div>
                <div class="input-group">
                    <label for="inputCapital">県庁所在地名</label>
                    <input type="text" id="inputCapital" placeholder="例: 新宿区" autocomplete="off">
                </div>
            </div>
            <div id="regionInputs" style="display:none;">
                <div class="input-group">
                    <label for="inputRegion">地方名</label>
                    <input type="text" id="inputRegion" placeholder="例: 関東地方" autocomplete="off">
                </div>
            </div>
            <div class="feedback-msg" id="feedback"></div>
            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
                <button class="btn-submit" onclick="checkAnswer()">決定</button>
            </div>
        </div>
    </div>

    <script>
        // 画像と同じ地方別カラーマッピング
        const regionColors = {
            "北海道地方": "var(--color-hokkaido)",
            "東北地方": "var(--color-tohoku)",
            "関東地方": "var(--color-kanto)",
            "中部地方": "var(--color-chubu)",
            "近畿地方": "var(--color-kinki)",
            "中国地方": "var(--color-chugoku)",
            "四国地方": "var(--color-shikoku)",
            "九州地方": "var(--color-kyushu)"
        };

        // 47都道府県の標準マスターデータ
        const prefData = {
            "hokkaido": { name: "北海道", capital: "札幌市", region: "北海道地方", path: "M580,40 L650,20 L730,50 L770,120 L720,180 L620,190 L560,170 L520,230 L490,210 L510,160 L570,130 Z" },
            "aomori": { name: "青森県", capital: "青森市", region: "東北地方", path: "M530,240 L580,240 L590,270 L550,290 L520,280 Z" },
            "iwate": { name: "岩手県", capital: "盛岡市", region: "東北地方", path: "M550,290 L590,295 L580,360 L540,350 Z" },
            "miyagi": { name: "宮城県", capital: "仙台市", region: "東北地方", path: "M540,350 L580,360 L570,400 L530,390 Z" },
            "akita": { name: "秋田県", capital: "秋田市", region: "東北地方", path: "M520,280 L550,290 L540,350 L510,340 Z" },
            "yamagata": { name: "山形県", capital: "山形市", region: "東北地方", path: "M510,340 L540,350 L530,390 L500,380 Z" },
            "fukushima": { name: "福島県", capital: "福島市", region: "東北地方", path: "M500,380 L570,400 L550,440 L490,420 Z" },
            "ibaraki": { name: "茨城県", capital: "水戸市", region: "関東地方", path: "M520,440 L550,440 L540,480 L510,470 Z" },
            "tochigi": { name: "栃木県", capital: "宇都宮市", region: "関東地方", path: "M490,420 L520,440 L510,470 L480,450 Z" },
            "gunma": { name: "群馬県", capital: "前橋市", region: "関東地方", path: "M450,420 L490,420 L480,450 L440,440 Z" },
            "saitama": { name: "埼玉県", capital: "さいたま市", region: "関東地方", path: "M450,450 L510,470 L500,490 L450,470 Z" },
            "chiba": { name: "千葉県", capital: "千葉市", region: "関東地方", path: "M510,470 L540,480 L530,530 L500,510 Z" },
            "tokyo": { name: "東京都", capital: "新宿区", region: "関東地方", path: "M460,475 L500,490 L490,505 L450,490 Z" },
            "kanagawa": { name: "神奈川県", capital: "横浜市", region: "関東地方", path: "M450,490 L490,505 L480,525 L440,510 Z" },
            "niigata": { name: "新潟県", capital: "新潟市", region: "中部地方", path: "M450,370 L500,380 L490,420 L450,420 L430,400 Z" },
            "toyama": { name: "富山県", capital: "富山市", region: "中部地方", path: "M400,410 L430,400 L420,430 L390,430 Z" },
            "ishikawa": { name: "石川県", capital: "金沢市", region: "中部地方", path: "M380,380 L400,370 L400,410 L380,430 Z" },
            "fukui": { name: "福井県", capital: "福井市", region: "中部地方", path: "M360,420 L390,430 L370,460 L340,440 Z" },
            "yamanashi": { name: "山梨県", capital: "甲府市", region: "中部地方", path: "M440,450 L470,450 L460,480 L430,470 Z" },
            "nagano": { name: "長野県", capital: "長野市", region: "中部地方", path: "M420,420 L450,420 L440,470 L410,480 Z" },
            "gifu": { name: "岐阜県", capital: "岐阜市", region: "中部地方", path: "M380,430 L420,430 L410,480 L370,470 Z" },
            "shizuoka": { name: "静岡県", capital: "静岡市", region: "中部地方", path: "M430,470 L480,480 L460,520 L420,500 Z" },
            "aichi": { name: "愛知県", capital: "名古屋市", region: "中部地方", path: "M380,470 L420,480 L410,515 L370,500 Z" },
            "mie": { name: "三重県", capital: "津市", region: "近畿地方", path: "M350,480 L380,480 L360,540 L330,520 Z" },
            "shiga": { name: "滋賀県", capital: "大津市", region: "近畿地方", path: "M350,450 L370,460 L360,485 L340,480 Z" },
            "kyoto": { name: "京都府", capital: "京都市", region: "近畿地方", path: "M320,430 L350,440 L340,480 L310,470 Z" },
            "osaka": { name: "大阪府", capital: "大阪市", region: "近畿地方", path: "M310,480 L330,485 L320,515 L300,505 Z" },
            "hyogo": { name: "兵庫県", capital: "神戸市", region: "近畿地方", path: "M280,440 L320,440 L310,485 L270,480 Z" },
            "nara": { name: "奈良県", capital: "奈良市", region: "近畿地方", path: "M330,485 L350,485 L340,525 L320,520 Z" },
            "wakayama": { name: "和歌山県", capital: "和歌山市", region: "近畿地方", path: "M300,510 L340,525 L320,560 L290,540 Z" },
            "tottori": { name: "鳥取県", capital: "鳥取市", region: "中国地方", path: "M230,440 L280,440 L270,465 L220,460 Z" },
            "shimane": { name: "島根県", capital: "松江市", region: "中国地方", path: "M170,450 L230,440 L220,465 L160,475 Z" },
            "okayama": { name: "岡山県", capital: "岡山市", region: "中国地方", path: "M220,465 L270,465 L260,490 L210,485 Z" },
            "hiroshima": { name: "広島県", capital: "広島市", region: "中国地方", path: "M160,475 L220,465 L210,495 L150,500 Z" },
            "yamaguchi": { name: "山口県", capital: "山口市", region: "中国地方", path: "M110,470 L160,475 L150,510 L100,500 Z" },
            "tokushima": { name: "徳島県", capital: "徳島市", region: "四国地方", path: "M220,540 L260,540 L250,570 L210,560 Z" },
            "kagawa": { name: "香川県", capital: "高松市", region: "四国地方", path: "M210,520 L250,520 L240,540 L200,540 Z" },
            "ehime": { name: "愛媛県", capital: "松山市", region: "四国地方", path: "M150,530 L200,530 L190,565 L140,560 Z" },
            "kochi": { name: "高知県", capital: "高知市", region: "四国地方", path: "M150,560 L250,570 L230,600 L140,580 Z" },
            "fukuoka": { name: "福岡県", capital: "福岡市", region: "九州地方", path: "M90,520 L130,520 L120,555 L80,550 Z" },
            "saga": { name: "佐賀県", capital: "佐賀市", region: "九州地方", path: "M60,530 L90,530 L80,555 L50,550 Z" },
            "nagasaki": { name: "長崎県", capital: "長崎市", region: "九州地方", path: "M30,540 L60,540 L50,580 L20,570 Z" },
            "kumamoto": { name: "熊本県", capital: "熊本市", region: "九州地方", path: "M70,560 L110,560 L100,600 L60,590 Z" },
            "oita": { name: "大分県", capital: "大分市", region: "九州地方", path: "M110,530 L140,535 L130,570 L100,565 Z" },
            "miyazaki": { name: "宮崎県", capital: "宮崎市", region: "九州地方", path: "M100,570 L130,570 L120,620 L90,610 Z" },
            "kagoshima": { name: "鹿児島県", capital: "鹿児島市", region: "九州地方", path: "M50,590 L100,600 L80,650 L40,630 Z" },
            "okinawa": { name: "沖縄県", capital: "那覇市", region: "九州地方", path: "M550,650 L750,650 L750,750 L550,750 Z" }
        };

        let currentMode = 'pref';
        let selectedId = null;
        let solvedPrefs = new Set();
        let solvedRegions = new Set();

        const mapPathsGroup = document.getElementById('mapPaths');

        // 初期化：画像のパステルカラーを適用した地図の生成
        function initMap() {
            mapPathsGroup.innerHTML = '';
            
            Object.keys(prefData).forEach(id => {
                const item = prefData[id];
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("d", item.path);
                path.setAttribute("class", "pref-path");
                path.setAttribute("id", `map-${id}`);
                path.setAttribute("fill", regionColors[item.region]);
                path.onclick = () => handleMapClick(id);

                mapPathsGroup.appendChild(path);
            });
        }

        // モード切り替え
        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('modePref').classList.toggle('active', mode === 'pref');
            document.getElementById('modeRegion').classList.toggle('active', mode === 'region');
            updateScoreDisplay();
            clearHighlights();
            updateMapStyles();
        }

        // クリックイベント
        function handleMapClick(id) {
            clearHighlights();
            const item = prefData[id];

            if (currentMode === 'pref') {
                if (solvedPrefs.has(id)) return;
                selectedId = id;
                document.getElementById(`map-${id}`).classList.add('active-highlight');
                openModal(`都道府県クイズ`, true);
            } else {
                if (solvedRegions.has(item.region)) return;
                selectedId = id;
                Object.keys(prefData).forEach(key => {
                    if (prefData[key].region === item.region) {
                        document.getElementById(`map-${key}`).classList.add('active-highlight');
                    }
                });
                openModal(`地方クイズ`, false);
            }
        }

        function openModal(title, isPref) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('prefInputs').style.display = isPref ? 'block' : 'none';
            document.getElementById('regionInputs').style.display = isPref ? 'none' : 'block';
            
            document.getElementById('inputPref').value = '';
            document.getElementById('inputCapital').value = '';
            document.getElementById('inputRegion').value = '';
            document.getElementById('feedback').innerText = '';
            document.getElementById('feedback').className = 'feedback-msg';

            document.getElementById('modalOverlay').classList.add('open');
            setTimeout(() => {
                if (isPref) document.getElementById('inputPref').focus();
                else document.getElementById('inputRegion').focus();
            }, 100);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
            clearHighlights();
        }

        function clearHighlights() {
            document.querySelectorAll('.pref-path').forEach(el => el.classList.remove('active-highlight'));
        }

        function normalize(str) {
            return str.trim()
                .replace(/(都道府県|都|道|府|県|地方|市|区)$/g, '')
                .toLowerCase();
        }

        function checkAnswer() {
            const feedback = document.getElementById('feedback');
            const target = prefData[selectedId];

            if (currentMode === 'pref') {
                const userPref = normalize(document.getElementById('inputPref').value);
                const userCapital = normalize(document.getElementById('inputCapital').value);

                const correctPref = normalize(target.name);
                const correctCapital = normalize(target.capital);

                if (userPref === correctPref && userCapital === correctCapital) {
                    feedback.innerText = "正解です！🎉";
                    feedback.className = "feedback-msg correct";
                    solvedPrefs.add(selectedId);
                    setTimeout(() => {
                        closeModal();
                        updateMapStyles();
                        updateScoreDisplay();
                    }, 800);
                } else {
                    feedback.innerText = `不正解... 正解は「${target.name} / ${target.capital}」`;
                    feedback.className = "feedback-msg wrong";
                }
            } else {
                const userRegion = normalize(document.getElementById('inputRegion').value);
                const correctRegion = normalize(target.region);

                if (userRegion === correctRegion) {
                    feedback.innerText = "正解です！🎉";
                    feedback.className = "feedback-msg correct";
                    solvedRegions.add(target.region);
                    setTimeout(() => {
                        closeModal();
                        updateMapStyles();
                        updateScoreDisplay();
                    }, 800);
                } else {
                    feedback.innerText = `不正解... 正解は「${target.region}」`;
                    feedback.className = "feedback-msg wrong";
                }
            }
        }

        function updateMapStyles() {
            Object.keys(prefData).forEach(id => {
                const el = document.getElementById(`map-${id}`);
                const item = prefData[id];
                const isSolved = (currentMode === 'pref') 
                    ? solvedPrefs.has(id) 
                    : solvedRegions.has(item.region);

                if (isSolved) {
                    el.classList.add('solved');
                } else {
                    el.classList.remove('solved');
                    el.setAttribute("fill", regionColors[item.region]);
                }
            });
        }

        function updateScoreDisplay() {
            const scoreEl = document.getElementById('score');
            const totalEl = document.getElementById('totalScore');

            if (currentMode === 'pref') {
                scoreEl.innerText = solvedPrefs.size;
                totalEl.innerText = '47';
            } else {
                scoreEl.innerText = solvedRegions.size;
                totalEl.innerText = '8';
            }
        }

        function resetGame() {
            if (confirm("進行状況をリセットしますか？")) {
                solvedPrefs.clear();
                solvedRegions.clear();
                updateMapStyles();
                updateScoreDisplay();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('modalOverlay').classList.contains('open')) {
                checkAnswer();
            }
        });

        initMap();
        updateScoreDisplay();
    </script>
</body>
</html>
